# dsh-session-policy bundle patch —— 原生优先（native-first）原则的落点。
#
# 本套件挂两行：
#   1. `dsh-session-policy` —— 会话级硬规则 + 诊断（session_rule / session_doctor）
#   2. `dsh-agent-rewind`   —— 命名恢复账本，作为本包的 dependencies 依赖
# 账本也可单独安装（见 packages/dsh-agent-rewind/cordis.patch.yml）；这里挂同一行
# （同 id + 同 name），保证 `add dsh-session-policy` 一把装好两件。
#
# 注意：本包**不** import 账本包——依赖关系只是 lockstep 安装，不构成模块依赖。
# 所以必须真的挂这一行，`agent_*` 三个工具才会注册。
#
# DSH 已提供的原语一律不重造、不包装、不平行实现——子代理与 Agent Teams、会话检索、
# 技能目录与加载、token 投影、审批与权限预设、沙箱策略都由宿主负责。
#
# ── 0.5.0 工具改名：消灭历史上的 `mop_` 前缀 ──
# 历史问题：包名用 `miopiik`、工具名用 `mop_` 前缀，是同一个词的两个缩写并存。
# 现统一为「工具名前缀 = 所属包职责」，与 DSH 官方先例同形（包 dsh-tool-session-query
# → 工具 session_*）：
#   mop_checkpoint        -> agent_checkpoint       （账本包）
#   mop_rewind            -> agent_rewind           （账本包）
#   mop_checkpoint_list   -> agent_checkpoint_list  （账本包）
#   mop_rule_inject / mop_rule_show / mop_rule_clear -> session_rule(action="inject"|"show"|"clear")
#   mop_doctor(seams)     -> session_doctor(mode="seams")
#   mop_doctor(stats)     -> session_doctor(mode="stats")
#   更早的历史工具（mop_checkpoint_prune / mop_learn / mop_learn_list / mop_recall /
#   mop_model_authorize）在此前的瘦身里已删除，不提供 shim。
#
# ── 旧包名已弃用（已发布版本留在 npm，无转发包；升级须先清理 profile 旧行）──
#   - dsh-miopiik-tool-recovery / -diagnostics / -capabilities / -checkpoint /
#     -run-stats / -learn / -magic-keywords：功能已合并进本包与账本包或整体删除。
#   - dsh-miopiik-policy：它守的 `subagent_execute` 是 **preset 里的行**，不是插件
#     能力。preset 配置归用户、本套件不再代管，那个行已不存在 → 守卫默认空转。
#     「为不存在的行准备的守卫」就是重叠面，按原生优先原则整体删除。需要强制显式
#     路由时，用 DSH 原生的 modelSelectionSettings + allowedModels 白名单。
#   - dsh-miopiik（套件聚合包）：拆成 dsh-session-policy + dsh-agent-rewind。
#   - '@deepseek-ai/dsh-tool-session-query'：提供模型可见的 session_* 五件套。
#     DSH 的 Agent Teams profile（本 profile 已启用）自带协作面，与本套件定位重叠；
#     该包仍是官方包，需要时自行加回：
#       dsh plugin --profile <name> add @deepseek-ai/dsh-tool-session-query
#   - preset 行：DSH 0.2 起 agent preset 是 `@deepseek-ai/dsh-agent-preset` 的声明行
#     （在 bundle patch 里声明），旧的 $DSH_HOME/.agent-presets/<id>/ 目录已无人读取。
- insert:
    - id: dsh-session-policy
      name: dsh-session-policy

    - id: dsh-agent-rewind
      name: 'dsh-agent-rewind'
