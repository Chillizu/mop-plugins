# MiOpIIk 0.5 挂载 smoke fixture：真实 DSH 服务行 + 唯一运行时 dsh-session-policy，
# 证明 inject 联合被真实服务满足、包经真实 Loader 可挂载，而不只是 mock register。
#
# 刻意不含 `persona` 行：@deepseek-ai/dsh-persona 的 apply 要求 agent-scoped context，
# 而本 boot() 挂载的是 leaf config（全局作用域），unscoped persona 会与 prompt registry
# 的自身 persona 注册冲突并 reject。DSH 0.2 起自定义 persona / plan-supervise-execute
# 层由 @deepseek-ai/dsh-agent-preset 的声明行拥有，本套件不再代管 preset。
#
# 服务行补齐运行时的 inject 联合：tools / fs / sandboxPolicy / sessions /
# sessionPersistence / systemPrompt (+ sessionQuery / sessionProjections)。session-query-sqlite
# 的 Config.path 无默认（required），须显式给 :memory:（对齐 base bundle）。
- id: session
  name: '@deepseek-ai/dsh-session'

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: ''

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write
    workspaceRoot: '/tmp/mop-composition-workspace'

- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: '/tmp/mop-composition-sessions'

- id: session-query-sqlite
  name: '@deepseek-ai/dsh-session-query-sqlite'
  config:
    path: ':memory:'
    openAt: never

# 两个保留行：策略包（规则 + 诊断）与账本包（checkpoint / rewind / list）。
# 账本包不 import 策略包，依赖关系只是版本 lockstep + 同 patch 挂载——必须各挂一行，
# 否则它的三个工具不会注册。persona / 层派发行由部署方的
# @deepseek-ai/dsh-agent-preset 声明行拥有，本套件不再代管 preset。
- id: dsh-agent-rewind
  name: 'dsh-agent-rewind'

- id: dsh-session-policy
  name: 'dsh-session-policy'
