# The full fixture (tools/session/agent/subagent/subagent-spawn) + all three
# Config-schema mop packages. Each carries no config here, so composition.test.mjs
# checks Loader coercion against the current contracts: executor gets only its
# non-model defaults (maxOutputChars/strict) while provider/model remain absent
# by design; the other schemas keep their own defaults/optional fields. This
# catches mock-stub-masked schema drift without reintroducing model fallback.
- id: session
  name: '@deepseek-ai/dsh-session'

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: ''

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'

- id: dsh-miopiik-executor
  name: 'dsh-miopiik-executor'

- id: dsh-miopiik-magic-keywords
  name: 'dsh-miopiik-magic-keywords'

- id: dsh-miopiik-model-auth
  name: 'dsh-miopiik-model-auth'
