# MiOpIIk 层挂载 smoke fixture：证明「6 个 MiOpIIk 运行时域/插件 + planner/supervisor 层派发行」
# 经真实 Loader 可挂载（inject 联合被真实 DSH 服务满足），而不只是 mock 测试里各自
# register。这是 examples/miopiik 的可自动化最小面。
#
# 刻意不含 `persona` 行：@deepseek-ai/dsh-persona 的 apply 要求 agent-scoped context，
# 而本 boot() 挂载的是 leaf config（全局作用域），unscoped persona 会与 prompt registry
# 的自身 persona 注册冲突并 reject。persona 挂载由真实 dsh 会话的 standingKeyFor 验证
# （见 examples/miopiik/README.md 的 smoke task）。
#
# 服务行补齐 mop 包的 inject 联合：tools / fs / sandboxPolicy / sessions /
# sessionPersistence / sessionQuery / systemPrompt / subagents。session-query-sqlite
# 的 Config.path 无默认（required），须显式给 :memory:（对齐 base bundle）。
- id: session
  name: '@deepseek-ai/dsh-session'

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: ''

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'

- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: '/tmp/mop-composition-sessions'

- id: session-query-sqlite
  name: '@deepseek-ai/dsh-session-query-sqlite'
  config:
    path: ':memory:'
    openAt: never

# MiOpIIk 层派发行（per-child persona 覆盖 + toolFilter；persona 文本为挂载占位，
# 全量 persona 见 examples/miopiik/agent.cordis.yml 与 docs/design/presets/drafts/）。
- id: tool-subagent-planner
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent_planner
    backgroundMode: continuable
    agentOptions:
      provider: deepseek-official
      model: deepseek-v4-pro
    persona: |
      # 规划层（Planner）系统提示
      （挂载冒烟占位）
    toolFilter:
      deny:
        - ask_user_question

- id: tool-subagent-supervisor
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent_supervisor
    backgroundMode: continuable
    agentOptions:
      provider: deepseek-official
      model: deepseek-v4-flash
    persona: |
      # 监督层（Supervisor）系统提示
      （挂载冒烟占位）
    toolFilter:
      allow:
        - read

- id: dsh-miopiik-tool-recovery
  name: 'dsh-miopiik-tool-recovery'

- id: dsh-miopiik-magic-keywords
  name: 'dsh-miopiik-magic-keywords'

- id: dsh-miopiik-diagnostics
  name: 'dsh-miopiik-diagnostics'

- id: dsh-miopiik-executor
  name: 'dsh-miopiik-executor'

- id: dsh-miopiik-learn
  name: 'dsh-miopiik-learn'

- id: dsh-miopiik-model-auth
  name: 'dsh-miopiik-model-auth'

