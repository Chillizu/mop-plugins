name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax check (node --check)
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Docs crossrefs
        run: bash tools/verify-crossrefs.sh
      - name: Test
        run: npm test
      # NOTE (P1-6): `npm test` uses real @deepseek-ai/schemastery (npm devDep),
      # so Config-contract regressions are caught here. The full real-boot checks
      # (npm run test:composition) need a built harness checkout and run in the
      # separate .github/workflows/composition.yml (manual + weekly), not this
      # push gate; see test/composition/README.md "CI coverage boundary".
