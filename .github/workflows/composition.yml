name: Composition

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  composition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install tested DSH distribution
        run: npm install -g @deepseek-ai/dsh@0.2.1-rc.2 --no-audit --no-fund
      - name: Real Loader integration and Session contract
        run: |
          npm run test:contract
          npm run test:composition
