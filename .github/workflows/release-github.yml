name: Publish GitHub Release

on:
  push:
    branches:
      - release/0.2.0-publish-artifacts

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e13b651748ad929750a332346cb99922fd9d9228
      - name: Create v0.2.0 tag and GitHub Release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v0.2.0 >/dev/null 2>&1; then
            echo "tag v0.2.0 already exists"
          else
            git tag v0.2.0 e13b651748ad929750a332346cb99922fd9d9228
            git push origin refs/tags/v0.2.0
          fi

          if gh release view v0.2.0 >/dev/null 2>&1; then
            echo "GitHub Release v0.2.0 already exists"
          else
            gh release create v0.2.0               --target e13b651748ad929750a332346cb99922fd9d9228               --title "MiOpIIk 0.2.0"               --generate-notes
          fi
