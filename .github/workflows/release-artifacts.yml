name: Release Artifacts

on:
  pull_request:
    branches: [main]

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify release source
        run: |
          npm ci
          node -e "const p=require('./packages/dsh-miopiik/package.json'); if(p.version!=='0.2.0') process.exit(1)"
          npm test
      - name: Pack public workspaces
        run: |
          mkdir -p release-tarballs
          for p in packages/dsh-miopiik-* packages/dsh-miopiik; do
            (cd "$p" && npm pack --pack-destination "$GITHUB_WORKSPACE/release-tarballs")
          done
          cd release-tarballs
          sha256sum *.tgz > SHA256SUMS
          ls -lh
      - name: Upload release tarballs
        uses: actions/upload-artifact@v4
        with:
          name: miopiik-0.2.0-tarballs
          path: release-tarballs/*
          if-no-files-found: error
          retention-days: 1
